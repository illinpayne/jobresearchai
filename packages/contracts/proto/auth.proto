
syntax = "proto3";

package auth.v1;

// Auth rpc
service AuthService {
	// Sends register request
	rpc SendRegisterOtp(RegisterSendOtpRequest) returns (RegisterSendOtpResponse);
	// Verifies register process by OTP code
	rpc VerifyRegisterOtp(RegisterVerifyOtpRequest) returns (AuthResponse);
	// Sign the session to log in
	rpc Login(LoginRequest) returns (AuthResponse);
	// Revalidate account session
	rpc RevalidateSession(RevalidateSessionRequest) returns (AuthResponse);
}

message RegisterSendOtpRequest {
	string email = 1;
	string password = 2;
	string first_name = 3;
	string second_name = 4;
}

message RegisterSendOtpResponse {
	bool status = 1;
	string message = 2;
}

message RegisterVerifyOtpRequest {
	string email = 1;
	string code = 2;
}

message LoginRequest {
	string email = 1;
	string password = 2;
}

message Account {
	string email = 1;
	string first_name = 2;
	string second_name = 3;
	string avatar = 4;
	bool is_email_verified = 5;
}

message AuthResponse {
	string access_token = 1;
	string refresh_token = 2;
	Account account = 3;
}

message RevalidateSessionRequest {
	string refresh_token = 1;
}
