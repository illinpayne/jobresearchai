
syntax = "proto3";

package job.v1;

import "google/protobuf/timestamp.proto";

import "pagination.proto";

// Jobs proto service
service JobService {
	rpc CreateJobToUser(CreateJobRequest) returns (Job);
	rpc GetJobById(GetJobByIdRequest) returns (Job);
	rpc GetJobs(GetJobsRequest) returns (JobPaginationResponse);
}

message Job {
	string id = 1;
	string title = 2;
	string description = 3;
	optional int32 salary_from = 4;
	optional int32 salary_to = 5;
	optional string location = 6;
	string source_url = 7;
	google.protobuf.Timestamp created_at = 8;
}

message CreateJobRequest {
	string title = 1;
	string description = 2;
	optional int32 salary_from = 3;
	optional int32 salary_to = 4;
	optional string location = 5;
	string source_url = 6;
	string account_id = 7;
}

message GetJobByIdRequest {
	string id = 1;
}

message GetJobsRequest {
	pagination.v1.PaginationOptions chunk = 1;
	string account_id = 2;
}

message JobPaginationResponse {
	repeated Job data = 1;
	pagination.v1.PaginationMeta meta = 2;
  }
